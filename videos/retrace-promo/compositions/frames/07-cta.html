    <script>
      (function () {

        var tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.0s): ambient glow bloom + wordmark spring-pop ──

          { opacity: 0.40, scale: 1.05, duration: 0.62, ease: "power2.out" },

        tl.to(".cta-glow",
          { opacity: 0.26, scale: 1.0, duration: 0.42, ease: "power2.inOut" },
          0.68);

        // >_ Retrace — sharp, fast landing. expo.out, NO overshoot (scale → 1.0).
        // Starts smaller + lower for more snap; resolves with the bloom peak.
        tl.fromTo(".cta-wm",
          { opacity: 0, scale: 0.52, y: 26 },
          { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: "expo.out" },
          0.10);

        // Caret snaps in on the wordmark settle, then blinks a bounded number of
        // times — finite discrete on/off tweens (no repeat/yoyo).
        tl.set(".cta-caret", { opacity: 1 }, 0.72);
        var caretTimes = [1.10, 1.65, 2.20, 2.75, 3.30];
        caretTimes.forEach(function (t) {
          tl.set(".cta-caret", { opacity: 0 }, t);
          tl.set(".cta-caret", { opacity: 1 }, t + 0.26);
        });

        // ── Scene 2 (1.0–2.4s): headline then sub, snappy per-word reveal ──
        // Tighter stagger + shorter, sharper tweens read as crisp, not sleepy.
        var headWords = gsap.utils.toArray(".cta-head .cta-w");
        headWords.forEach(function (el, i) {
          tl.fromTo(el,
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.32, ease: "expo.out" },
            1.00 + i * 0.13);
        });

        var subWords = gsap.utils.toArray(".cta-sub .cta-sw");
        subWords.forEach(function (el, i) {
          tl.fromTo(el,
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" },
            1.62 + i * 0.09);
        });

        // ── Scene 3 (2.4–4.0s): loop-line self-draws bottom→up, rhythmically ──
        // Three segments (rise · step · final rise) each draw with power2.out,
        // staggered at ~75% of the prior so it reads as ONE continuous pen with
        // rhythm — accelerating toward the top edge.
        var segs = ["#cta-loop-s1", "#cta-loop-s2", "#cta-loop-s3"];
        var lens = [];
        segs.forEach(function (sel) {
          var p = document.querySelector(sel);
          if (!p) { lens.push(0); return; }
          var len = p.getTotalLength() * 1.02; // slight overestimate is safe
          lens.push(len);
          p.style.strokeDasharray = String(len);
          p.style.strokeDashoffset = String(len); // fully hidden at start
        });
        // Durations proportional to feel: long rise, quick step, decisive final rise.
        var segStart = [2.40, 2.86, 3.18];
        var segDur   = [0.62, 0.42, 0.40];
        segs.forEach(function (sel, i) {
          var p = document.querySelector(sel);
          if (!p) return;
          tl.fromTo(p,
            { strokeDashoffset: lens[i] },
            { strokeDashoffset: 0, duration: segDur[i], ease: "power2.out" },
            segStart[i]);
        });

        // Leading spark: rides the final segment upward and continues OFF the top
        // edge — the light "upward send" toward the next loop's terminal ($ up top).
        // One finite pass; fades as it clears the frame.
        tl.fromTo("#cta-loop-spark",
