  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ===============================================================
      // Scene 1 (0.0–1.2s): inverse zoom-through ARRIVAL at the card.
      //   We come THROUGH from Frame 4's node — start pushed in past 1
      //   (scale 1.16) and heavily blurred, then punch to rest crisply.
      //   expo.out gives the "arriving at" 締まり with NO overshoot.
      //   The zoom lives on the wrapper so the card keeps its own push-in
      //   transform later (no transform conflict).
      // ===============================================================
      tl.fromTo(
        "#exp-zoom",
        { scale: 1.16, opacity: 0, filter: "blur(20px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.82, ease: "expo.out" },
        0.0
      );
      // title bar chrome slides down into place, snapping the top edge —
      // reinforces the "landed" read of the arrival.
      tl.fromTo(
        "#exp-bar",
        { y: -18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" },
        0.18
      );
      // evidence badge lands crisply just after the bar — defines early,
      // per the packet ("evidence バッジが先に定着").
      tl.fromTo(
        "#exp-ev",
        { opacity: 0, y: -10, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "expo.out" },
        0.42
      );

      // ===============================================================
      // Scene 2 (1.2–3.4s): reveal ONE label-row at a time in reading
      //   order — amber label first, then the cream body. v2: tighter
      //   stagger (畳みかける), expo.out, NO overshoot. amber→cream rhythm.
      // ===============================================================
      var rowStarts = [1.18, 1.74, 2.32];
      ["#exp-row-1", "#exp-row-2", "#exp-row-3"].forEach(function (id, i) {
        var t0 = rowStarts[i];
        // amber label chunk snaps in from the left
        tl.fromTo(
          id + " .exp-lbl",
          { opacity: 0, x: -18 },
          { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" },
          t0
        );
        // cream body chunk follows the label a beat later (reading rhythm)
        tl.fromTo(
          id + " .exp-txt",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.36, ease: "expo.out" },
          t0 + 0.12
        );
      });

      // ===============================================================
      // Scene 3 (3.4–6.2s): diff types on (discrete-text-sequence /
      //   smooth char-slice). v2: KEEP IT KEYBOARD-CRISP — a visible,
      //   kinetic speed. Red del line first, then the green + line.
      // ===============================================================
      var DEL_FULL = "- func Attack(target string, resCh chan *Result) *Metrics {";
      var ADD_FULL = "+ func Attack(ctx context.Context, target string, ...) {";

      // red del line: type on 3.30 -> 4.18 (キビキビ, ~0.016s/char feel)
      var delState = { n: 0 };
      var delEl = null;
      tl.to(
        delState,
        {
          n: DEL_FULL.length,
          duration: 0.88,
          ease: "none",
          onUpdate: function () {
            if (!delEl) delEl = document.getElementById("exp-del");
            if (delEl) delEl.textContent = DEL_FULL.substring(0, Math.floor(delState.n));
          },
        },
        3.30
      );

      // green add line: type on 4.42 -> 5.34 (snappy; lands after del)
      var addState = { n: 0 };
      var addEl = null;
      tl.to(
        addState,
        {
          n: ADD_FULL.length,
          duration: 0.92,
          ease: "none",
          onUpdate: function () {
            if (!addEl) addEl = document.getElementById("exp-add-text");
            if (addEl) addEl.textContent = ADD_FULL.substring(0, Math.floor(addState.n));
          },
        },
        4.42
      );

      // ONE gentle push-in on the whole card, timed to the green + line
      // landing — a single camera lean toward the payoff. fromTo, no bounce.
      tl.fromTo(
        "#exp-card",
        { scale: 1 },
        { scale: 1.028, duration: 0.85, ease: "power2.out" },
        4.9
      );

      // GREEN keyword-glow (asr-keyword-glow envelope) on the evidence badge
      // and the word "ctx" the MOMENT the green + line lands. v2: a touch
      // stronger — the confidence spike of the shot. Finite, single driver,
      // decays to a rest breadcrumb — no repeat/yoyo.
      var GLOW_START = 5.34;  // green line has just fully landed
      var GLOW_DUR = 1.5;
      var ATTACK = 0.20;
      var RELEASE = 0.62;
      var REST = 0.16;
      function glowEnv(local) {
        if (local < 0) return 0;
        if (local < ATTACK) return local / ATTACK;                       // attack to 1
        var relEnd = ATTACK + RELEASE;
        if (local < relEnd) return 1 - ((local - ATTACK) / RELEASE) * (1 - REST); // decay to rest
        return REST;                                                     // hold breadcrumb
      }
      var glowDriver = { t: 0 };
      var evEl = null, kwEl = null;
      tl.to(
        glowDriver,
        {
          t: GLOW_DUR,
          duration: GLOW_DUR,
          ease: "none",
          onUpdate: function () {
            if (!evEl) evEl = document.getElementById("exp-ev");
            if (!kwEl) kwEl = document.getElementById("exp-kw");
            var env = glowEnv(glowDriver.t);
            // green glow hugging the glyphs (text-shadow) + a small scale pop
            if (kwEl) {
              kwEl.style.textShadow =
                "0 0 " + (22 * env).toFixed(2) + "px rgba(86,211,100," + (0.92 * env).toFixed(3) + ")";
              kwEl.style.color = env > 0.22 ? "#56d364" : "#d6deeb";
              kwEl.style.transform = "scale(" + (1 + 0.06 * env).toFixed(3) + ")";
              kwEl.style.display = "inline-block";
            }
            if (evEl) {
              evEl.style.textShadow =
                "0 0 " + (20 * env).toFixed(2) + "px rgba(63,185,80," + (0.78 * env).toFixed(3) + ")";
              evEl.style.borderColor = "rgba(63,185,80," + (0.35 + 0.45 * env).toFixed(3) + ")";
            }
          },
        },
        GLOW_START
      );

      // ===============================================================
      // Caret blink — deterministic sin square wave across the whole
      // duration (finite, no CSS animation). Only motion during the
      // Scene 4 hold (6.2–8.0s): the confidence breather. push/breathing なし.
      // ===============================================================
      var TOTAL = 8;
      var BLINK_CYCLES = 13; // ~0.6s per cycle
      var GREEN_TYPE_START = 4.42;
      var blink = { p: 0 };
      var caretEl = null;
      tl.to(
        blink,
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: TOTAL,
          ease: "none",
          onUpdate: function () {
            if (!caretEl) caretEl = document.getElementById("exp-caret");
            if (!caretEl) return;
            // scene-local time reconstructed from the driver phase
            var sceneT = (blink.p / (Math.PI * 2 * BLINK_CYCLES)) * TOTAL;
            // caret hidden until the green line begins typing, then blinks
            if (sceneT < GREEN_TYPE_START) {
              caretEl.style.opacity = "0";
            } else {
              caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
            }
          },
        },
        0
      );

      window.__timelines["05-explanation"] = tl;
    })();
  </script>
