            <span data-hf-id="hf-3u09" class="exp-txt">ダミー波形の periodic 関数を削除し、attacker.Attack を呼ぶ goroutine へ置き換えた。</span>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---------------------------------------------------------------
      // Scene 1 (0.0–1.2s): inverse zoom-through arrival at the card.
      //   Card scales up from a slightly zoomed-in read, un-blurs and
      //   settles. Title bar + evidence badge are the first thing to land.
      // ---------------------------------------------------------------
      tl.fromTo(
        "#exp-card",
        { scale: 0.86, opacity: 0, filter: "blur(14px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 1.0, ease: "power3.out" },
        0.0
      );
      // evidence badge lands with a touch of confidence just after the card
      tl.fromTo(
        "#exp-ev",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.55
      );

      // ---------------------------------------------------------------
      // Scene 2 (1.2–3.4s): reveal ONE label-row at a time, in reading
      //   order — amber label first, then the cream body. Staggered per
      //   row, NOT front-loaded. power3.
      // ---------------------------------------------------------------
      var rowStarts = [1.25, 1.95, 2.68];
      ["#exp-row-1", "#exp-row-2", "#exp-row-3"].forEach(function (id, i) {
        var t0 = rowStarts[i];
        // amber label chunk
        tl.fromTo(
          id + " .exp-lbl",
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" },
          t0
        );
        // cream body chunk follows the label
        tl.fromTo(
          id + " .exp-txt",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          t0 + 0.16
        );
      });

      // ---------------------------------------------------------------
      // Scene 3 (3.4–6.2s): diff types on (discrete-text-sequence).
      //   First the red "- func Attack(...)" line, then the green
      //   "+ func Attack(ctx context.Context, ...)" line. Discrete state
      //   swaps at thresholds — instant jumps, no smear.
      // ---------------------------------------------------------------
      var DEL_FULL = "- func Attack(target string, resCh chan *Result) *Metrics {";
      var ADD_FULL = "+ func Attack(ctx context.Context, target string, ...) {";

      // red del line: type on 3.45 -> 4.55
      var delState = { n: 0 };
      var delEl = null;
      tl.to(
        delState,
        {
          n: DEL_FULL.length,
          duration: 1.1,
          ease: "none",
          onUpdate: function () {
            if (!delEl) delEl = document.getElementById("exp-del");
            if (delEl) delEl.textContent = DEL_FULL.substring(0, Math.floor(delState.n));
          },
        },
        3.45
      );

      // green add line: type on 4.75 -> 5.95 (lands after del completes)
      var addState = { n: 0 };
      var addEl = null;
      tl.to(
        addState,
        {
          n: ADD_FULL.length,
          duration: 1.2,
          ease: "none",
          onUpdate: function () {
            if (!addEl) addEl = document.getElementById("exp-add-text");
            if (addEl) addEl.textContent = ADD_FULL.substring(0, Math.floor(addState.n));
          },
        },
        4.75
      );

      // Restrained GREEN keyword-glow (asr-keyword-glow envelope) on the
      // evidence badge and the word "ctx" the moment the green + line lands.
      // Finite tween, single driver, decays to a rest breadcrumb — no repeat.
      var GLOW_START = 5.95; // green line has just fully landed
      var GLOW_DUR = 1.4;
      var ATTACK = 0.22;
      var RELEASE = 0.6;
      var REST = 0.14;
      function glowEnv(local) {
        if (local < 0) return 0;
        if (local < ATTACK) return local / ATTACK; // attack to 1
        var relEnd = ATTACK + RELEASE;
        if (local < relEnd) return 1 - ((local - ATTACK) / RELEASE) * (1 - REST); // decay to rest
        return REST; // hold breadcrumb
      }
      var glowDriver = { t: 0 };
      var evEl = null, kwEl = null;
      tl.to(
        glowDriver,
        {
          t: GLOW_DUR,
          duration: GLOW_DUR,
          ease: "none",
          onUpdate: function () {
            if (!evEl) evEl = document.getElementById("exp-ev");
            if (!kwEl) kwEl = document.getElementById("exp-kw");
            var env = glowEnv(glowDriver.t);
            // green glow hugging the glyphs (text-shadow), badge edge lifts
            if (kwEl) {
              kwEl.style.textShadow = "0 0 " + (18 * env).toFixed(2) + "px rgba(86,211,100," + (0.85 * env).toFixed(3) + ")";
              kwEl.style.color = env > 0.25 ? "#56d364" : "#d6deeb";
            }
            if (evEl) {
              evEl.style.textShadow = "0 0 " + (16 * env).toFixed(2) + "px rgba(63,185,80," + (0.7 * env).toFixed(3) + ")";
              evEl.style.borderColor = "rgba(63,185,80," + (0.35 + 0.4 * env).toFixed(3) + ")";
            }
          },
        },
        GLOW_START
      );

      // ---------------------------------------------------------------
      // Caret blink — deterministic sin square wave across the whole
      // duration (finite, no CSS animation). Only motion during the
      // Scene 4 hold (6.2–8.0s): the confidence breather.
      // ---------------------------------------------------------------
      var TOTAL = 8;
      var BLINK_CYCLES = 13; // ~0.6s per cycle
      var blink = { p: 0 };
      var caretEl = null;
      tl.to(
        blink,
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: TOTAL,
          ease: "none",
          onUpdate: function () {
            if (!caretEl) caretEl = document.getElementById("exp-caret");
            if (!caretEl) return;
            // caret hidden until the green line begins typing, then blinks
            if (blink.p / (Math.PI * 2 * BLINK_CYCLES) * TOTAL < 4.75) {
              caretEl.style.opacity = "0";
            } else {
              caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
            }
          },
        },
        0
      );

      window.__timelines["05-explanation"] = tl;
    })();
  </script>
