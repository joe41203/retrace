    .cl-card {

  <div data-hf-id="hf-bpz9" id="root" data-composition-id="04-commit-lane" data-start="0" data-duration="9.4" data-width="1920" data-height="1080">

    <div data-hf-id="hf-isfg" class="cl-kicker" id="cl-kicker"><span data-hf-id="hf-6o16" class="spk">✱</span>&#160;FIRST-PARENT MAINLINE</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // ---- deterministic commit data (seq 昇順 = 下方向) ----
      // seq1 が最古(最下段アンカー)。higher seq が下から供給され上へ抜ける。
      var COMMITS = [
        { seq: 1,  sha: "0e3aa10", subj: "Initial commit",              add: 120, del: 0  },
        { seq: 2,  sha: "7b12d94", subj: "Add project scaffold",        add: 86,  del: 4  },
        { seq: 3,  sha: "c4f0a21", subj: "Wire request runner",         add: 142, del: 18 },
        { seq: 4,  sha: "2d9e5c8", subj: "Parse target from flags",     add: 64,  del: 9  },
        { seq: 5,  sha: "1c0be9f", subj: "Draw dummy chart",            add: 64,  del: 2  },
        { seq: 6,  sha: "5ab1a75", subj: "Enable to attack",           add: 84,  del: 36 },
        { seq: 7,  sha: "9d24e7b", subj: "Refactor result channel",     add: 58,  del: 31 },
        { seq: 8,  sha: "a3f1c02", subj: "Add unit tests for attacker", add: 120, del: 4  },
        { seq: 9,  sha: "e70bd35", subj: "Render latency histogram",    add: 97,  del: 12 },
        { seq: 10, sha: "f81c9a4", subj: "Stream results to stdout",    add: 73,  del: 21 }
      ];

      // geometry
      var NODE_PITCH = 150;   // node center 間隔
      var FIRST_OFFSET = 40;  // seq1(i=0) center の wrapper-top からの距離
      var LANE_H = 746;       // viewport 高
      var CENTER = LANE_H / 2; // 373 (viewport-local center)
      // 座標系: node center(local wrapper) = FIRST_OFFSET + i*PITCH. viewport 内 screen-local y =
      //   center_local + ty.  center を 373 に合わせたい。
      // seq1(i=0) center_local=40. screen y = 40 + ty. Scene2 で seq1 を viewport 下部 y≈640 に:
      //   ty_s2 = 640-40 = 600.  seq6(i=5) center_local=40+750=790 → 端で 373: ty_end=373-790=-417.
      var TY_S2 = 600;
      var TY_END = -417;

      var nodesWrap = document.getElementById("cl-nodes");
      var world = document.getElementById("cl-world");
      var focusBand = document.getElementById("cl-focus-band");
      var laneGlow = document.getElementById("cl-lane-glow");
      var nodeEls = [];
      var haloEls = [];
      var addEls = [];
      var delEls = [];
      COMMITS.forEach(function (c, i) {
        var n = document.createElement("div");
        n.className = "cl-node";
        n.style.top = (FIRST_OFFSET + i * NODE_PITCH) + "px";
        n.setAttribute("data-i", String(i));
        n.innerHTML =
          '<div class="cl-halo"></div>' +
          '<div class="cl-dot"></div>' +
          '<div class="cl-card">' +
            '<div class="cl-meta">' +
              '<span class="cl-seq">seq ' + c.seq + '</span>' +
              '<span class="cl-sha">' + c.sha + '</span>' +
              '<span class="cl-subj">' + c.subj + '</span>' +
              '<span class="cl-badge"><span class="cl-add">+' + c.add + '</span> <span class="cl-del">-' + c.del + '</span></span>' +
            '</div>' +
          '</div>';
        nodesWrap.appendChild(n);
        nodeEls.push(n);
        haloEls.push(n.querySelector(".cl-halo"));
        addEls.push(n.querySelector(".cl-add"));
        delEls.push(n.querySelector(".cl-del"));
      });

      // ---- head per-word split ----
      var headEl = document.getElementById("cl-head");
      var HEAD_WORDS = ["mainline ", "を、", "Initial commit", " から", "古い順に。"];
      var EM_IDX = 2; // "Initial commit" を強調
      var wordEls = HEAD_WORDS.map(function (w, i) {
        var s = document.createElement("span");
        s.className = "w" + (i === EM_IDX ? " em" : "");
        s.textContent = w;
        headEl.appendChild(s);
        return s;
      });

      // ---- per-frame driver: DoF(中央 crisp / 端 dim) + 中央通過 bloom ----
      // すべて scroll.ty から決定的に算出。毎フレームは applyLane() が一括で書く。
      var CRISP_HALF = 150;   // この距離内は完全 crisp
      var FALL_RANGE = 320;   // これを超えると最大 dim
      var MAX_BLUR = 3.4;     // px（小面なので軽量）
      var MIN_OP = 0.16;
      var BLOOM_RANGE = 96;   // 中央からこの距離内で bloom（着地の点灯感）
      function smooth(t) { return t * t * (3 - 2 * t); }
      function applyLane() {
        var ty = scroll.ty;
        for (var k = 0; k < nodeEls.length; k++) {
          var el = nodeEls[k];
          var centerLocal = FIRST_OFFSET + k * NODE_PITCH; // wrapper-local
          var screenY = centerLocal + ty;                  // viewport-local (0..746)
          var d = Math.abs(screenY - CENTER);
          // --- DoF: 中央 crisp → 端 dim ---
          var t;
          if (d <= CRISP_HALF) t = 0;
          else if (d >= FALL_RANGE) t = 1;
          else t = (d - CRISP_HALF) / (FALL_RANGE - CRISP_HALF);
          var te = smooth(t);
          el.style.opacity = (1 - te * (1 - MIN_OP)).toFixed(3);
          el.style.filter = "blur(" + (te * MAX_BLUR).toFixed(2) + "px)";
          // --- bloom: 中央通過の瞬間だけ短く灯る（0=遠い → 1=中央）---
          var b = d >= BLOOM_RANGE ? 0 : smooth(1 - d / BLOOM_RANGE);
          var halo = haloEls[k];
          halo.style.opacity = (b * 0.9).toFixed(3);
          halo.style.transform = "scale(" + (1 + b * 3.2).toFixed(3) + ")";
          // dot 自体の点灯感も上げる（box-shadow 半径 + 明るさ）
          var dotEl = el.querySelector(".cl-dot");
          if (dotEl) {
            var glow = 16 + b * 26;
            var al = (0.55 + b * 0.4).toFixed(3);
            dotEl.style.boxShadow = "0 0 " + glow.toFixed(1) + "px rgba(63, 185, 80, " + al + ")";
            dotEl.style.borderColor = b > 0.5 ? "#56d364" : "#3fb950";
          }
          // add/del バッジの点灯感（中央で bright、離れると base）
          addEls[k].style.color = b > 0 ? "rgb(" + Math.round(63 + b * 23) + "," + Math.round(185 + b * 26) + "," + Math.round(80 + b * 20) + ")" : "#3fb950";
          addEls[k].style.textShadow = b > 0.35 ? "0 0 12px rgba(86,211,100," + (b * 0.5).toFixed(2) + ")" : "none";
          delEls[k].style.textShadow = b > 0.35 ? "0 0 12px rgba(248,81,73," + (b * 0.4).toFixed(2) + ")" : "none";
        }
      }

      // ---- rhythmic flow ease（GSAP custom ease function・決定的） ----
      // scroll.ty を「単一の直接プロパティ tween」で TY_S2 → TY_END へ動かし、その ease に
      // 緩急リズム＋末尾デセルを織り込む。proxy を介さないので他 tween と scroll.ty を奪い合わず、
      // seek でも確実に反映される（前バージョンの property 競合を回避）。
      //   e(p) = base(p) + ripple(p)
      //   base   : ほぼ等速 cruise ＋ 末尾で滑らかに減速（linear と ease-out の blend）
      //   ripple : 低振幅 sin（N 回の accel/decel・末尾で 0 へ収束し停止をクリーンに）
      // e(0)=0, e(1)=1, 全域で単調増加（逆流なし＝カメラ酔い回避）。数値検証済み。
      var FLOW_CYCLES = 3;                 // 流れの中で緩急を 3 回
      var FLOW_AMP = 0.03;                 // ripple 振幅（小＝痙攣でなく緩急）
      var CRUISE_MIX = 0.45;               // 0=完全等速, 1=完全 ease-out（末尾デセルの強さ）
      var TWO_PI_N = Math.PI * 2 * FLOW_CYCLES;
      function rhythmEase(p) {
        var base = (1 - CRUISE_MIX) * p + CRUISE_MIX * (1 - Math.pow(1 - p, 2.2));
        var ripple = FLOW_AMP * Math.sin(TWO_PI_N * p) * (1 - p);
        return base + ripple;
      }

      // ---- timeline ----
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["04-commit-lane"] = tl;

      // scroll 状態 — 単一ソース。applyLane を onUpdate で回す。
      var scroll = { ty: TY_S2 };
      function writeScroll() {
        nodesWrap.style.transform = "translateY(" + scroll.ty + "px)";
        applyLane();
      }
      // camera 状態（zoom-to-target・単一ソース）
      var cam = { scale: 1 };
      function applyCamera() {
        world.style.transform = "scale(" + cam.scale + ")";
      }
      // seed frame0（Scene1 は静止: S2 位置で待機）
      applyCamera();
      writeScroll();

      // ===== Scene 1 (0.0–1.2s): 地→lane 引き→head per-word =====
      // lane self-draw (svg-path-draw, power3)
      var lanePath = document.getElementById("cl-lane-path");
      var len = lanePath.getTotalLength() * 1.05;
      lanePath.style.strokeDasharray = String(len);
      lanePath.style.strokeDashoffset = String(len);
      tl.fromTo(lanePath, { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.85, ease: "power3.out" }, 0.05);
      tl.fromTo(laneGlow, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.45);
      // kicker
      tl.fromTo("#cl-kicker", { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.15);
      // head per-word staggered reveal
      tl.fromTo(wordEls, { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.1 }, 0.35);
      // note（下部・薄く）
      tl.fromTo("#cl-note", { opacity: 0, x: -14 },
        { opacity: 0.9, x: 0, duration: 0.6, ease: "power2.out" }, 0.7);

      // ===== Scene 2 (1.2–3.0s): ノード点灯（下→上 stagger）＋カード横入り =====
      // dot pop（キビキビ・back 抑制で overshoot なし）→ card slide-in。index 由来 stagger で決定的。
      var dots = Array.prototype.slice.call(document.querySelectorAll(".cl-dot"));
      var cards = Array.prototype.slice.call(document.querySelectorAll(".cl-card"));
      // dot 点灯: 全 dot を i 順に stagger（見えないものは端 fade で隠れる）
      tl.fromTo(dots, { scale: 0 },
        { scale: 1, duration: 0.34, ease: "power3.out", stagger: 0.06 }, 1.2);
      // card 横入り（lane から velocity-matched に出る）
      tl.fromTo(cards, { opacity: 0, x: -40 },
        { opacity: 1, x: 0, duration: 0.46, ease: "power2.out", stagger: 0.06 }, 1.32);

      // ===== Scene 3 → 4a (1.5–7.8s): 緩急スクロール＋末尾デセル（seq6 中央で停止） =====
      // scroll.ty を単一の直接プロパティ tween で TY_S2 → TY_END へ。ease=rhythmEase が
      // 「ほぼ等速 cruise ＋ 3 回の緩急 ＋ 末尾の滑らかな減速→停止」を一本で担う。
      // onUpdate: writeScroll が毎フレーム DoF/bloom を再計算（seek でも確実に反映）。
      // 停止点 TY_END=-417 で seq6(i=5) がちょうど中央(373)に来る。
      tl.fromTo(scroll, { ty: TY_S2 }, {
        ty: TY_END,
        duration: 6.3,                      // 1.5 → 7.8
        ease: rhythmEase,
        onUpdate: writeScroll
      }, 1.5);

      // ===== Scene 4b (7.8–8.9s): seq6 中央で軽い zoom-to-target（寄り）で締める =====
      // viewport-change（単一 world scale・別オブジェクトなので scroll.ty と競合しない）。
      // bouncy 無し・power2.inOut。中央帯も薄く灯して締める。次フレームの寄りへ繋ぐ。
      tl.to(cam, {
        scale: 1.14,
        duration: 1.1,                      // 7.8 → 8.9
        ease: "power2.inOut",
        onUpdate: applyCamera
      }, 7.8);
      tl.fromTo(focusBand, { opacity: 0 },
        { opacity: 1, duration: 0.9, ease: "power2.out" }, 7.8);

      // (c) hold（8.9–9.4s）: 緑レーンの流れ感だけ低振幅 sine で残す（決定的・repeat なし）。
      var jit = { p: 0 };
      tl.to(jit, {
        p: 1,
        duration: 0.5,                      // 8.9 → 9.4
        ease: "none",
        onUpdate: function () {
          var ph = jit.p * Math.PI * 4;             // 2 周期
          var g = 0.86 + Math.sin(ph) * 0.12;       // 0.74..0.98
          laneGlow.style.opacity = g.toFixed(3);
          laneGlow.style.transform = "scaleX(" + (0.95 + (Math.sin(ph) * 0.5 + 0.5) * 0.1).toFixed(3) + ")";
        }
      }, 8.9);
    })();
  </script>
</template>
